{% extends "base.html" %}
{% block page_title %}Nova Auditoria{% endblock %}
{% block title %}Nova Auditoria · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Nova Auditoria</h1>
    <p class="page-sub">Depois de abrir, congele o estoque teórico antes de contar.</p>
  </div>
</div>

<div class="panel form-panel">
  <form method="POST" class="grid-form">
    <label>Data início *
      <input type="date" name="data_inicio" value="{{ hoje }}" required>
    </label>
    <label>Data fim *
      <input type="date" name="data_fim" value="{{ hoje }}" required>
    </label>
    <label>Tipo
      <select name="tipo" id="selTipo" onchange="toggleCat()">
        <option value="completa">Completa (todos os produtos)</option>
        <option value="por_categoria">Por categoria</option>
      </select>
    </label>
    <label id="lblCat" style="display:none">Categoria
      <select name="id_categoria">
        <option value="">—</option>
        {% for c in categorias %}
        <option value="{{ c.id_categoria }}">{{ c.nome }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Tolerância (%)
      <input type="number" step="0.01" min="0" max="100"
             name="tolerancia_percentual" value="1">
      <span class="hint">Diferenças até este % do teórico são aceites.</span>
    </label>
    <label>Tolerância (valor mínimo)
      <input type="number" step="0.01" min="0"
             name="tolerancia_valor_minimo" value="0">
      <span class="hint">Diferenças abaixo deste valor são aceites.</span>
    </label>
    <label class="span-2">Observações
      <textarea name="observacoes" rows="2"></textarea>
    </label>
    <div class="form-actions span-2">
      <button type="submit" class="btn btn-primary">Abrir Auditoria</button>
      <a href="{{ url_for('auditorias_list') }}" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleCat() {
  const t = document.getElementById('selTipo').value;
  document.getElementById('lblCat').style.display = (t === 'por_categoria') ? '' : 'none';
}
toggleCat();
</script>
{% endblock %}
