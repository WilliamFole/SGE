{% extends "base.html" %}
{% block title %}Recuperar senha · {{ app_name }}{% endblock %}
{% block content_noauth %}
<div class="login-screen">
  <div class="login-panel">
    <div class="login-mark">◈</div>
    <h1 class="app-title">Nova Senha</h1>
    <p class="login-sub">Passo 2 · Defina uma nova senha segura</p>

    <div class="user-preview-box">
  <strong>{{ usuario_nome }}</strong>
  <small>Login: {{ usuario_login }}</small>
</div>

    <form method="POST" class="login-form">
      <label>Nova senha
        <input type="password" name="nova_senha" id="novaSenha" placeholder="••••••••" required
               autocomplete="new-password">
        <span class="hint">Mínimo 8 caracteres, pelo menos 1 letra, 1 número e 1 símbolo.</span>
      </label>
      <label>Confirmar nova senha
        <input type="password" name="confirmar_senha" id="confirmarSenha" placeholder="••••••••" required
               autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block" onclick="return validarSenhas()">Guardar nova senha</button>
    </form>
    <a href="{{ url_for('login') }}" class="back-to-login">← Voltar ao login</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function validarSenhas() {
  var p1 = document.getElementById('novaSenha').value;
  var p2 = document.getElementById('confirmarSenha').value;
  if (p1.length < 8) { alert('A senha deve ter pelo menos 8 caracteres.'); return false; }
  if (!/[A-Za-z]/.test(p1)) { alert('A senha deve conter pelo menos uma letra.'); return false; }
  if (!/\d/.test(p1)) { alert('A senha deve conter pelo menos um número.'); return false; }
  if (!/[^A-Za-z0-9]/.test(p1)) { alert('A senha deve conter pelo menos um símbolo.'); return false; }
  if (p1 !== p2) { alert('As senhas não coincidem.'); return false; }
  return true;
}
</script>
{% endblock %}
