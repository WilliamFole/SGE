{% extends "base.html" %}
{% block page_title %}Trocar Senha{% endblock %}
{% block title %}Trocar Senha · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Trocar Senha</h1>
    <p class="page-sub">Atualize sua senha de acesso com segurança</p>
  </div>
</div>

<div class="panel form-panel">
  <form method="POST" class="stack-form">
    <label>Senha atual
      <input type="password" name="senha_atual" required>
    </label>
    <label>Nova senha <span class="hint">(mínimo 8 caracteres, com letra, número e símbolo)</span>
      <input type="password" name="nova_senha" required>
    </label>
    <label>Confirmar nova senha
      <input type="password" name="confirmar_senha" required>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Alterar senha</button>
    </div>
  </form>
</div>
{% endblock %}
